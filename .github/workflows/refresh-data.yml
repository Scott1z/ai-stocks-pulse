name: Refresh sector data

# Runs the pipeline hourly. News, quotes, fundamentals, and each stock's
# last-reported-earnings actuals (beat/miss) come from Finnhub (60 calls/min
# free tier) for all 50 tracked tickers, paced ~1.1s apart. Alpha Vantage's
# free-tier budget (25 req/day) is reserved for real daily OHLC candles
# (only the original 23 tickers — OHLC_TICKERS, not all 50) + the earnings
# calendar (all 50) — fetched once per day only (23 tickers + 1 calendar
# request, ~5 min with AV's 5 req/min pacing), cached the other 23 runs.
# Writes data.json + pipeline/price_history.json + pipeline/daily_ohlc.json +
# pipeline/summary_archive.json (rolling 30-day history of sector summaries),
# and commits them back so GitHub Pages serves the latest snapshot.
# Also runnable by hand from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 pipeline/fetch_and_curate.py

      # if: always() — runs even if "Run pipeline" above failed partway
      # through. Without this, a crash AFTER fetch_daily_batch() already
      # wrote pipeline/daily_ohlc.json to local disk (e.g. a later failure
      # in curate_with_claude) meant that real Alpha Vantage data — and the
      # _fetchedDate cache marker that tells the next run "don't re-fetch
      # today" — never got committed. The next run (even the same day) then
      # saw a cache miss and re-spent the day's scarce 25-request AV quota
      # from scratch, on top of whatever the failed run already used.
      # Observed in production 2026-08-11: two failed runs each burned a
      # full 23-ticker + calendar AV fetch before crashing later on an
      # unrelated bug, so by the time a run finally succeeded end-to-end,
      # AV's daily quota was almost gone — only 14/23 tickers got real
      # candles and the earnings calendar came back empty. This step now
      # commits whatever partial progress exists on disk regardless of the
      # pipeline's exit code — data.json itself is only ever written at the
      # very end of main(), so a run that dies before finishing simply
      # leaves data.json untouched (nothing incomplete gets published),
      # while the expensive-to-refetch AV cache is preserved either way.
      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json pipeline/price_history.json pipeline/daily_ohlc.json pipeline/summary_archive.json
          git diff --cached --quiet || git commit -m "Refresh sector data"
          git push
