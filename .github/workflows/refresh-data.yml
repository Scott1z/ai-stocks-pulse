name: Refresh sector data

# Runs the pipeline hourly. News now comes from Finnhub (not Alpha Vantage),
# which frees the full Alpha Vantage free-tier budget (25 req/day) for real
# daily OHLC candles — fetched once per day only (21 tickers, ~4-5 min with
# AV's 5 req/min pacing), cached the other 23 runs. Writes data.json +
# pipeline/price_history.json + pipeline/daily_ohlc.json, and commits them
# back so GitHub Pages serves the latest snapshot.
# Also runnable by hand from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 pipeline/fetch_and_curate.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json pipeline/price_history.json pipeline/daily_ohlc.json
          git diff --cached --quiet || git commit -m "Refresh sector data"
          git push
